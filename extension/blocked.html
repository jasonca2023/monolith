<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked — Monolith</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #08080c;
        color: #d8ffe0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 100%;
      }
      pre {
        margin: 0 0 24px;
        font-size: clamp(6px, 1.6vw, 14px);
        line-height: 1.05;
        color: #37ff6f;
        text-shadow: 0 0 12px rgba(55, 255, 111, 0.35);
        overflow-x: auto;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #6f7d75;
        margin: 0 0 10px;
      }
      p {
        margin: 0;
        color: #8a9a90;
        font-size: 13px;
        line-height: 1.7;
      }
      .host {
        color: #ff5f6d;
      }
      .taunt {
        margin-top: 26px;
        color: #4a544e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="mode">Deep Work</h1>
      <pre id="clock" aria-live="polite">--:--</pre>
      <p><span class="host" id="host">this site</span> is sealed for the duration of the shift.</p>
      <p class="taunt" id="taunt">Monolith is holding the door. Go back to the editor.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
